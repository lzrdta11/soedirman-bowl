    <!-- White stripes -->
    <path d="M4.5 10.5 Q16 13 27.5 10.5" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.9"/>
    <path d="M4.5 21.5 Q16 19 27.5 21.5" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.9"/>
    <!-- Center seam & laces -->
    <line x1="7.5" y1="16" x2="24.5" y2="16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="11.5" y1="13.5" x2="11.5" y2="18.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="13" x2="16" y2="19" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20.5" y1="13.5" x2="20.5" y2="18.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>