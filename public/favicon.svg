<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="ballShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b85824"/>
      <stop offset="60%" stop-color="#8d3f18"/>
      <stop offset="100%" stop-color="#552008"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-40 16 16)">
    <!-- Ball body -->
